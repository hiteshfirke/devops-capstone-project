[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service

[coverage:report]
show_missing = True
fail_under = 95

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,.venv

[pylint.MASTER]
ignore = .venv
disable = C0114,C0115,C0116,R0903,E1101,C0413,R0401
max-line-length = 127
