[nosetests]
verbosity=2
with-spec=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,.venv

[pylint.MASTER]
ignore = .venv
disable = C0114,C0115,C0116,R0903,E1101,C0413,R0401,R0801
max-line-length = 127
