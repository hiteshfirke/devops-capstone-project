apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: build-image
  tasks:
    - name: init
      workspaces: [{name: source, workspace: pipeline-workspace}]
      taskRef: {name: cleanup}
    - name: clone
      runAfter: [init]
      workspaces: [{name: output, workspace: pipeline-workspace}]
      taskRef: {name: git-clone}
      params:
        - {name: url, value: $(params.repo-url)}
        - {name: revision, value: $(params.branch)}
    - name: lint
      runAfter: [clone]
      workspaces: [{name: source, workspace: pipeline-workspace}]
      taskRef: {name: flake8}
    - name: tests
      runAfter: [clone]
      workspaces: [{name: source, workspace: pipeline-workspace}]
      taskRef: {name: nose}
    - name: build
      runAfter: [lint, tests]
      workspaces: [{name: source, workspace: pipeline-workspace}]
      taskRef: {name: buildah}
      params:
        - {name: IMAGE, value: $(params.build-image)}
    - name: deploy
      runAfter: [build]
      workspaces: [{name: manifest-dir, workspace: pipeline-workspace}]
      taskRef: {name: openshift-client}
      params:
        - {name: SCRIPT, value: "kubectl apply -f k8s/deployment.yaml"}
