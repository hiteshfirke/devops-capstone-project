apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-edit
subjects:
  - kind: ServiceAccount
    name: pipeline
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: ws
  params:
    - name: repo-url
    - name: branch
      default: main
  tasks:
    - name: clone
      workspaces: [{name: ws, workspace: ws}]
      taskSpec:
        workspaces: [{name: ws}]
        steps:
          - name: clone
            image: alpine/git
            script: |
              rm -rf $(workspaces.ws.path)/src
              git clone -b $(params.branch) $(params.repo-url) $(workspaces.ws.path)/src
      params: [{name: repo-url, value: $(params.repo-url)}, {name: branch, value: $(params.branch)}]
    - name: lint
      runAfter: [clone]
      workspaces: [{name: ws, workspace: ws}]
      taskSpec:
        workspaces: [{name: ws}]
        steps:
          - name: flake8
            image: python:3.12-slim
            workingDir: $(workspaces.ws.path)/src
            script: |
              pip install -q flake8
              flake8 service --count --max-complexity=10 --max-line-length=127 --statistics
    - name: tests
      runAfter: [lint]
      workspaces: [{name: ws, workspace: ws}]
      taskSpec:
        workspaces: [{name: ws}]
        steps:
          - name: nosetests
            image: python:3.12-slim
            workingDir: $(workspaces.ws.path)/src
            script: |
              pip install -q -r requirements.txt
              nosetests
    - name: deploy
      runAfter: [tests]
      workspaces: [{name: ws, workspace: ws}]
      taskSpec:
        workspaces: [{name: ws}]
        steps:
          - name: apply
            image: alpine/k8s:1.31.2
            workingDir: $(workspaces.ws.path)/src
            script: |
              kubectl apply -f k8s/deployment.yaml
              kubectl rollout restart deployment/accounts
              kubectl rollout status deployment/accounts --timeout=120s
